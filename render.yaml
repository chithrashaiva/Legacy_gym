services:
  # -------------------------------------------------------------
  # Unified Monolith Service (Frontend + Backend in One)
  # -------------------------------------------------------------
  - type: web
    name: legacy-gym
    env: python
    region: singapore
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: VITE_API_URL
        value: "/api"

  # -------------------------------------------------------------
  # Standalone Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: legacy-gym-frontend
    env: static
    buildCommand: cd frontend && npm install --include=dev && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: VITE_API_URL
        value: "https://legacy-gym-backend.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # -------------------------------------------------------------
  # Standalone Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: legacy-gym-backend
    env: python
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
